# On a v* tag: builds both firmware files and attaches them to a draft release (notes written by hand)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tools/version.py names the tag
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio==6.2.0
      - run: pio run -e pico -e pico2
      - name: Check that both builds report the tag
        run: |
          strings .pio/build/pico/firmware.elf | grep -qx "$GITHUB_REF_NAME"
          strings .pio/build/pico2/firmware.elf | grep -qx "$GITHUB_REF_NAME"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .pio/build/pico/firmware.uf2 "photopainter-7color-$GITHUB_REF_NAME.uf2"
          cp .pio/build/pico2/firmware.uf2 "photopainter-6color-$GITHUB_REF_NAME.uf2"
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "" \
            "photopainter-7color-$GITHUB_REF_NAME.uf2" "photopainter-6color-$GITHUB_REF_NAME.uf2"
