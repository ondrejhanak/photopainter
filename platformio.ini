; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
framework = arduino

; Build flags
build_flags =
    -D PICO_STDIO_USB=1
    -D PICO_STDIO_UART=0
    -Wl,--print-memory-usage
    ; Force using our local FatFs, not framework's
    -I lib/FatFs_SPI/ff14a/source
    -I lib/FatFs_SPI/sd_driver
    -I lib/FatFs_SPI/include
    -I lib/Config
    ; Compatibility with bare Pico SDK code
    -D ARDUINO_ARCH_RP2040

; Library configuration
; PlatformIO will auto-discover all subdirectories in lib/
lib_ldf_mode = deep+
lib_compat_mode = soft
; Ignore conflicting libraries from framework
lib_ignore =
    FatFS
    SD
    SPI

; Upload configuration
upload_protocol = mbed
; Explicit port: auto-detection can pick other mounted volumes (e.g. Xcode simulator runtimes)
upload_port = /Volumes/RPI-RP2

; Monitor configuration (for USB serial debugging)
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem*
monitor_filters = default
