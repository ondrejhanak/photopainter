; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds and flashes the 7-colour frame; the 6-colour one with `-e pico2`
default_envs = pico

; Shared by every frame; each [env:...] below adds its board and panel
[env]
; Pinned: the platform brings the toolchain, the framework is Arduino-Pico 6.3.2; bump both together
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
platform_packages =
    framework-arduinopico@https://github.com/earlephilhower/arduino-pico.git#ca7b727df0e1b4266d6e09f93800ac839c2f4052
board_build.core = earlephilhower
framework = arduino

; Build flags
build_flags =
    ; Route printf() to USB serial (Arduino-Pico debug port)
    -D DEBUG_RP2040_PORT=Serial
    -Wl,--print-memory-usage
    ; %f in printf (battery voltage); nano-printf drops float support without it
    -Wl,-u,_printf_float
    ; Force using our local FatFs, not framework's
    -I lib/FatFs_SPI/ff14a/source
    -I lib/FatFs_SPI/sd_driver
    -I lib/FatFs_SPI/include
    -I lib/Config
    ; Compatibility with bare Pico SDK code
    -D ARDUINO_ARCH_RP2040

; Library configuration
; PlatformIO will auto-discover all subdirectories in lib/
lib_ldf_mode = deep+
lib_compat_mode = soft
; Ignore conflicting libraries from framework
lib_ignore =
    FatFS
    SD
    SPI

; Upload configuration
; picotool resets the board into BOOTSEL via a 1200-baud touch on its USB serial port,
; then flashes, verifies and starts the firmware. If the firmware has no working USB
; serial (crash/hang), enter BOOTSEL with the buttons; picotool detects it and skips the reset.
; FIRMWARE_VERSION from git tags (firmware_version.h)
extra_scripts = pre:tools/version.py
upload_protocol = picotool

; Monitor configuration (for USB serial debugging)
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem*
monitor_filters = default

; PhotoPainter: RP2040, 7-colour 7.3" e-Paper (F)
[env:pico]
board = pico
build_flags =
    ${env.build_flags}
    -D PANEL_7IN3F

; PhotoPainter (B): RP2350 with 16 MB flash, 6-colour 7.3" e-Paper (E)
[env:pico2]
board = rpipico2
board_upload.maximum_size = 16777216
build_flags =
    ${env.build_flags}
    -D PANEL_7IN3E
